<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Webtris</title>
  <link rel="stylesheet" href="index.scss">
</head>

<body>
  <dialog id="game-mode" open>
    <form method="dialog">
      <label>Play Solo<input type="button" value="Solo" id="solo"></label>
      <label>Host Multiplayar Game<input type="button" value="Host" id="host"></label>
      <label>Join Multiplayar Game<input type="button" value="Join" id="join"></label>
    </form>
  </dialog>

  <table class="info" hidden>
    <tr>
      <td>Score</td>
      <td class="score"></td>
    </tr>
    <tr>
      <td>Lines</td>
      <td class="lines"></td>
    </tr>
    <tr>
      <td>Level</td>
      <td class="level"></td>
    </tr>
    <tr>
      <td colspan="2" class="next-shape-text">Next Shape</td>
    </tr>
    <tr>
      <td colspan="2" class="next-shape"></td>
    </tr>
  </table>
  </div>

  <div class="webtris">Loading...</div>
  <script type="module" src="./src/index.ts"></script>
</body>

</html>
